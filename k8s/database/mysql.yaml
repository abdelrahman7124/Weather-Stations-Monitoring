apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: weather-monitoring
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: weatherroot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: weather-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: weather_monitoring
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: schema
          configMap:
            name: mysql-schema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-schema
  namespace: weather-monitoring
data:
  schema.sql: |
    CREATE DATABASE IF NOT EXISTS weather_monitoring
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE weather_monitoring;
    CREATE TABLE IF NOT EXISTS weather_readings (
      id BIGINT AUTO_INCREMENT PRIMARY KEY,
      station_id BIGINT NOT NULL,
      sequence_number BIGINT NOT NULL,
      battery_status VARCHAR(10) NOT NULL,
      timestamp BIGINT NOT NULL,
      humidity INT NOT NULL,
      temperature INT NOT NULL,
      wind_speed INT NOT NULL,
      INDEX idx_station_id (station_id),
      INDEX idx_station_seq (station_id, sequence_number),
      UNIQUE KEY uq_station_sequence (station_id, sequence_number)
    );
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: weather-monitoring
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
