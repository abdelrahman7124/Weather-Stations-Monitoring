apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: central-station:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/weather_monitoring
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: central-station
  namespace: weather-monitoring
spec:
  selector:
    app: central-station
  ports:
    - name: app
      port: 8080
      targetPort: 8080
